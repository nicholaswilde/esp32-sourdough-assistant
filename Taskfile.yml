version: '3'

dotenv: ['.env']

includes:
  firmware:
    taskfile: ./firmware/Taskfile.yml
    dir: ./firmware
  model:
    taskfile: ./model/Taskfile.yml
    dir: ./model

tasks:
  # --- Firmware Shortcuts ---
  build:
    desc: Build the ESP32-S3 firmware (delegates to firmware/)
    cmds:
      - task: firmware:build

  test:
    desc: Run host-native unit tests (delegates to firmware/)
    cmds:
      - task: firmware:test

  flash:
    desc: Flash the firmware to ESP32-S3 (delegates to firmware/)
    cmds:
      - task: firmware:flash

  ota:
    desc: Flash firmware binary over WiFi via HTTP OTA update (delegates to firmware/)
    cmds:
      - task: firmware:ota
        vars:
          DEVICE_IP: '{{.DEVICE_IP}}'
          DEVICE_PORT: '{{.DEVICE_PORT}}'

  flash-model:
    desc: Flash the compiled model binary to partition at 0x520000 (delegates to firmware/)
    cmds:
      - task: firmware:flash-model

  monitor:
    desc: Open serial monitor (delegates to firmware/)
    cmds:
      - task: firmware:monitor

  test-device:
    desc: Reset, capture boot banner, and test on-device inference over serial
    vars:
      PROMPT: '{{.PROMPT | default ""}}'
    cmds:
      - task: firmware:test-device
        vars:
          PROMPT: '{{.PROMPT}}'

  test-http:
    desc: Query on-device OpenAI-compatible HTTP API over WiFi (e.g. task test-http PROMPT="Why is my bread gummy?")
    vars:
      PROMPT: '{{.PROMPT | default ""}}'
    cmds:
      - task: firmware:test-http
        vars:
          PROMPT: '{{.PROMPT}}'
          DEVICE_IP: '{{.DEVICE_IP}}'
          DEVICE_PORT: '{{.DEVICE_PORT}}'

  eval-http:
    desc: Run automated HTTP health check, response evaluation, and diagnostics (delegates to firmware/)
    vars:
      PROMPT: '{{.PROMPT | default ""}}'
      DIAGNOSE: '{{.DIAGNOSE | default "false"}}'
    cmds:
      - task: firmware:eval-http
        vars:
          PROMPT: '{{.PROMPT}}'
          DIAGNOSE: '{{.DIAGNOSE}}'


  models-http:
    desc: Query on-device /v1/models endpoint over WiFi
    cmds:
      - task: firmware:models-http
        vars:
          DEVICE_IP: '{{.DEVICE_IP}}'
          DEVICE_PORT: '{{.DEVICE_PORT}}'

  benchmark:
    desc: Record on-device benchmark results and compare against baseline and previous runs
    vars:
      NAME: '{{.NAME | default ""}}'
      RUN: '{{.RUN | default "false"}}'
    cmds:
      - task: firmware:benchmark
        vars:
          NAME: '{{.NAME}}'
          RUN: '{{.RUN}}'

  download-model:
    desc: Download Sourdough model bundle from Hugging Face Hub into firmware/models/
    vars:
      REPO: '{{.REPO | default ""}}'
    cmds:
      - task: firmware:download-model
        vars:
          REPO: '{{.REPO}}'

  # --- Model Training Shortcuts ---
  generate:
    desc: Generate and expand curated Sourdough Q&A dataset (delegates to model/)
    cmds:
      - task: model:generate

  prepare:
    desc: Build vocabulary, layout, and pre-encode dataset (delegates to model/)
    cmds:
      - task: model:prepare

  train:
    desc: Train Sourdough PLE micro-LLM (1,200 steps) (delegates to model/)
    cmds:
      - task: model:train

  train-full:
    desc: Extended train Sourdough PLE micro-LLM (2,000 steps) (delegates to model/)
    cmds:
      - task: model:train-full

  quantize:
    desc: Quantize trained checkpoint to INT4 packed binary format and update C headers
    cmds:
      - task: model:quantize

  headers:
    desc: Generate C++ headers from vocab and layout into firmware/src/generated/
    cmds:
      - task: model:headers

  sample:
    desc: Query the trained Sourdough model with a prompt
    vars:
      PROMPT: '{{.PROMPT | default ""}}'
    cmds:
      - task: model:sample
        vars:
          PROMPT: '{{.PROMPT}}'

  upload-model:
    desc: Upload Sourdough model bundle to Hugging Face Hub (delegates to model/)
    vars:
      REPO: '{{.REPO | default ""}}'
      PATH: '{{.PATH | default ""}}'
    cmds:
      - task: model:upload-model
        vars:
          REPO: '{{.REPO}}'
          PATH: '{{.PATH}}'

  colab-train:
    desc: Run Sourdough PLE micro-LLM training on Colab VM (delegates to model/)
    cmds:
      - task: model:colab-train

  # --- Repository & Code Intelligence ---
  codegraph:
    desc: Show CodeGraph index status
    cmds:
      - codegraph status

  codegraph-sync:
    desc: Synchronize CodeGraph index with codebase changes
    cmds:
      - codegraph sync
