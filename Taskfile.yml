---
version: '3'

tasks:
  build:
    desc: Build the firmware
    cmds:
      - pio run -e esp32-s3-devkitc-1

  flash:
    desc: Flash the firmware to the ESP32-S3
    cmds:
      - pio run -e esp32-s3-devkitc-1 --target upload

  monitor:
    desc: Open serial monitor
    cmds:
      - pio device monitor

  test:
    desc: Run host-native unit tests
    cmds:
      - pio test -e native

  test-device:
    desc: Reset, capture boot banner, and test on-device inference over serial
    vars:
      PROMPT: '{{.PROMPT | default ""}}'
    cmds:
      - uv run --with pyserial python .agents/skills/test-device/scripts/test_device.py {{if .PROMPT}}--query "{{.PROMPT}}"{{end}}

  benchmark:
    desc: Record on-device benchmark results and compare against baseline and previous runs
    vars:
      NAME: '{{.NAME | default ""}}'
      RUN: '{{.RUN | default "false"}}'
    cmds:
      - uv run python .agents/skills/record-benchmark/scripts/record_benchmark.py {{if eq .RUN "true"}}--run{{end}} {{if .NAME}}--name "{{.NAME}}"{{end}}


  generate:
    desc: Generate and expand curated Sourdough Q&A dataset
    cmds:
      - uv run python -m research.sourdough.generate --samples 5000

  vocab:
    desc: Build frozen curated output vocabulary (vocab.json) from dataset
    cmds:
      - uv run python -m research.sourdough.build_vocab

  layout:
    desc: Train BPE question encoder and build asymmetric out2in mapping (layout.json)
    cmds:
      - uv run python -m research.sourdough.build_layout

  subvocab:
    desc: Generate sub-vocabulary cluster headers for hierarchical output head
    cmds:
      - uv run python pc_tools/generate_subvocab.py

  headers:
    desc: Generate C++ headers (sourdough_words.h, sourdough_out2in.h, sourdough_subvocab.h) from vocab and layout
    cmds:
      - uv run python pc_tools/generate_vocab_headers.py
      - uv run python pc_tools/generate_subvocab.py


  prepare:
    desc: Build vocabulary, layout, and pre-encode dataset for asymmetric vocabulary
    cmds:
      - task: vocab
      - task: layout
      - task: headers
      - uv run python pc_tools/generate_tokenizer_asset.py
      - uv run python -m research.sourdough.prepare_asymmetric

  validate-dataset:
    desc: Verify dataset integrity, token lengths, and roundtrip fidelity without training
    cmds:
      - uv run python -m research.sourdough.verify_dataset

  query-dataset:
    desc: Query the dataset directly to see answers and matches before training (e.g. task query-dataset QUERY="Why is my bread gummy?")
    vars:
      QUERY: '{{.QUERY | default "Why is there liquid on top of my sourdough starter?"}}'
    cmds:
      - uv run python -m research.sourdough.verify_dataset --query "{{.QUERY}}"

  train:
    desc: Train Sourdough PLE micro-LLM with asymmetric vocabulary (1,200 steps)
    cmds:
      - uv run python -m research.sourdough.train --arm ple --asymmetric --steps 1200 --eval-every 100

  train-full:
    desc: Extended train Sourdough PLE micro-LLM with asymmetric vocabulary (2,000 steps)
    cmds:
      - uv run python -m research.sourdough.train --arm ple --asymmetric --steps 2000 --eval-every 100

  sample:
    desc: Query the trained Sourdough model with a prompt (e.g. task sample PROMPT="Why is my bread gummy?")
    vars:
      PROMPT: '{{.PROMPT | default "Why is there liquid on top of my sourdough starter?"}}'
    cmds:
      - uv run python -m research.sourdough.sample "{{.PROMPT}}"

  quantize:
    desc: Quantize trained checkpoint to INT4 packed binary format and update C headers
    cmds:
      - uv run python pc_tools/export_model.py --ckpt runs/sourdough/ple-sourdough-v1-s0.pt
      - uv run python pc_tools/generate_vocab_headers.py
      - uv run python pc_tools/generate_tokenizer_asset.py

  flash-model:
    desc: Flash the compiled model binary to partition at 0x110000
    cmds:
      - esptool --baud 921600 --port /dev/ttyACM0 write-flash 0x110000 pc_tools/sourdough_q4.bin

  upload-model:
    desc: Upload Sourdough model bundle (README.md, LICENSE, metadata.json, *.bin, tokenizer.json, sourdough_qa.jsonl) to Hugging Face Hub
    cmds:
      - uv run python upload_model_hf.py --path pc_tools/

  download-model:
    desc: Download Sourdough model bundle from Hugging Face Hub (e.g. task download-model REPO=nicholascwilde/esp32-s3-sourdough)
    vars:
      REPO: '{{.REPO | default ""}}'
    cmds:
      - uv run python download_model_hf.py {{if .REPO}}--repo-id "{{.REPO}}"{{end}}

  colab-auth:
    desc: Verify Google Colab CLI authentication
    cmds:
      - uv run python colab_runner.py check-auth

  colab-start:
    desc: Provision a free-tier Colab VM session (T4 GPU fallback to CPU)
    cmds:
      - uv run python colab_runner.py start-session

  colab-stop:
    desc: Stop active Colab VM session
    cmds:
      - uv run python colab_runner.py stop-session

  colab-train-test:
    desc: Run fast smoke training test (50 steps) on Colab VM
    cmds:
      - uv run python colab_runner.py build --action train-test

  colab-train:
    desc: Run Sourdough PLE micro-LLM training (1,200 steps) on Colab VM
    cmds:
      - uv run python colab_runner.py build --action train

  colab-train-full:
    desc: Run extended Sourdough PLE micro-LLM training (2,000 steps) on Colab VM
    cmds:
      - uv run python colab_runner.py build --action train-full

